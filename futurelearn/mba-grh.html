<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBA Gestion des Ressources Humaines · Cours FutureLearn Unlimited</title>
<meta name="description" content="Vérification du statut Unlimited des cours FutureLearn associés au programme MBA Gestion des Ressources Humaines (état au 15/10/2026).">
<style>
:root{--bg:#f7f7fb;--surface:#fff;--ink:#16213d;--muted:#596579;--line:#e6e7f0;--accent:#8b5cf6;--accent-soft:#f1ebff;--pink:#ff4da6;--orange:#f97316;--title:#0a4ea1;--gold:#f97316;
--ok:#16794c;--ok-bg:#e4f5ec;--warn:#9a6700;--warn-bg:#fff3d6;--bad:#b42318;--bad-bg:#fde8e6;--info:#475569;--info-bg:#eaeef4;--radius:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--surface:#161e2e;--ink:#e8edf6;--muted:#9aa6bc;--line:#26324a;--accent:#7db3f0;--accent-soft:#1a2a44;
--ok:#59d39a;--ok-bg:#12301f;--warn:#f0c04f;--warn-bg:#3a2d0c;--bad:#ff8f84;--bad-bg:#3d1714;--info:#aab6cc;--info-bg:#1f2a40}}
:root[data-theme=dark]{--bg:#0e1420;--surface:#161e2e;--ink:#e8edf6;--muted:#9aa6bc;--line:#26324a;--accent:#7db3f0;--accent-soft:#1a2a44;--ok:#59d39a;--ok-bg:#12301f;--warn:#f0c04f;--warn-bg:#3a2d0c;--bad:#ff8f84;--bad-bg:#3d1714;--info:#aab6cc;--info-bg:#1f2a40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-top:4px solid var(--pink)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
header.hero{padding:40px 0 20px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--accent);text-decoration:none}
h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:0 0 8px;letter-spacing:-.01em;color:var(--title)}
.sub{color:var(--muted);margin:0;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.todo b{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-bottom:24px}
.bar i{display:block;height:100%}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tools input{flex:1 1 220px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.theme{margin-left:auto}
.list{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;border-left:5px solid var(--line);box-shadow:0 8px 24px rgba(10,78,161,.06);transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(139,92,246,.13)}
.card.ok{border-left-color:var(--ok)}.card.norun,.card.redir{border-left-color:var(--warn)}.card.no,.card.dead,.card.invite{border-left-color:var(--bad)}
.card h2{margin:0 0 2px;font-size:18px}
.course{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:8px}
.course a.main{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.course a.main:hover{text-decoration:underline}
.slug{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.norun,.badge.redir{background:var(--warn-bg);color:var(--warn)}
.badge.no,.badge.dead,.badge.invite{background:var(--bad-bg);color:var(--bad)}
.note{font-size:13.5px;color:var(--muted);margin-top:6px}
.rem{margin-top:12px;padding:12px 14px;background:var(--accent-soft);border-radius:10px}
.rem h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.rem ul{margin:0;padding-left:18px}
.rem li{margin:3px 0}
.rem a{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.rem a:hover{text-decoration:underline}
.course-block+.course-block{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:520px){.theme{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="crumb"><a href="index.html">← Tous les programmes</a></div>
  <h1>MBA Gestion des Ressources Humaines</h1>
  <p class="sub">Cours FutureLearn Unlimited à utiliser pour chaque matière du programme, vérifiés le 15/10/2026.</p>
</header>
<section class="stats" id="stats"></section>
<div class="bar" id="bar" aria-hidden="true"></div>
<div class="tools">
  <input id="q" type="search" placeholder="Rechercher une matière ou un cours…" aria-label="Rechercher">
  <button class="chip theme" id="theme" aria-label="Changer de thème">◐ Thème</button>
</div>
<main class="list" id="list"></main>
<footer>CESAG ONLINE · Vérification FutureLearn Unlimited · état au 15/10/2026</footer>
</div>
<script>
const ENGLISH=false;
const DATA=[{"matiere": "positionnement de la Fonction RH dans l'organisation", "courses": [{"course": "Building influence as a key human resource management professional", "slug": "building-influence-as-a-key-human-resource-management-professional", "url": "https://www.futurelearn.com/courses/building-influence-as-a-key-human-resource-management-professional", "flag": "norun"}]}, {"matiere": "Finance d'entreprise (finance pour RH)", "courses": [{"course": "Corporate finance a beginners guide", "slug": "corporate-finance-a-beginners-guide", "url": "https://www.futurelearn.com/courses/corporate-finance-a-beginners-guide", "flag": null}, {"course": "Fundamentals of corporate finance", "slug": "fundamentals-of-corporate-finance", "url": "https://www.futurelearn.com/courses/fundamentals-of-corporate-finance", "flag": null}, {"course": "Financial management", "slug": "financial-management", "url": "https://www.futurelearn.com/courses/financial-management", "flag": null}]}, {"matiere": "RSE et Developpement durable", "courses": [{"course": "Corporate social responsibility", "slug": "corporate-social-responsibility", "url": "https://www.futurelearn.com/courses/corporate-social-responsibility", "flag": null}]}, {"matiere": "Développement personnel et projet professionnel", "courses": [{"course": "Essential skills for your career development", "slug": "essential-skills-for-your-career-development", "url": "https://www.futurelearn.com/courses/essential-skills-for-your-career-development", "flag": null}]}, {"matiere": "Digitalisation des processus RH (SIRH)", "courses": [{"course": "How to recruit and onboard online", "slug": "how-to-recruit-and-onboard-online", "url": "https://www.futurelearn.com/courses/how-to-recruit-and-onboard-online", "flag": null}]}, {"matiere": "Talent acquisition Management du recrutement", "courses": [{"course": "Human resources hiring and managing talent in the 21st century", "slug": "human-resources-hiring-and-managing-talent-in-the-21st-century", "url": "https://www.futurelearn.com/courses/human-resources-hiring-and-managing-talent-in-the-21st-century", "flag": "norun"}]}, {"matiere": "Management des RH à l'international", "courses": [{"course": "Introduction to international human resources management", "slug": "introduction-to-international-human-resources-management", "url": "https://www.futurelearn.com/courses/introduction-to-international-human-resources-management", "flag": null}]}, {"matiere": "Diagnostic organisationnel et conduite du changement", "courses": [{"course": "Change management", "slug": "change-management-packt", "url": "https://www.futurelearn.com/courses/change-management-packt", "flag": null}, {"course": "Leadership and change management for sustainability success", "slug": "leadership-and-change-management-for-sustainability-success", "url": "https://www.futurelearn.com/courses/leadership-and-change-management-for-sustainability-success", "flag": null}]}, {"matiere": "Pilotage de la performance RH des carrieres", "courses": [{"course": "People management skills", "slug": "people-management-skills", "url": "https://www.futurelearn.com/courses/people-management-skills", "flag": null}]}, {"matiere": "Management de soi et Gestion de l'equipe", "courses": [{"course": "Working in a team how to succeed", "slug": "working-in-a-team-how-to-succeed", "url": "https://www.futurelearn.com/courses/working-in-a-team-how-to-succeed", "flag": "norun"}]}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=DATA.reduce((a,g)=>a+g.courses.length,0);
document.getElementById('stats').innerHTML=(ENGLISH?'':`<div class="stat"><b>${DATA.length}</b><span>matières</span></div>`)+`<div class="stat ok"><b>${total}</b><span>cours Unlimited</span></div>`;
document.getElementById('bar').remove();
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const g=DATA.map(x=>({matiere:x.matiere,courses:x.courses.filter(c=>((x.matiere||'')+' '+c.course+' '+c.slug).toLowerCase().includes(q))})).filter(x=>x.courses.length);
  const l=document.getElementById('list');
  if(!g.length){l.innerHTML='<div class="empty">Aucun résultat.</div>';return}
  l.innerHTML=g.map(x=>`<article class="card ok">${x.matiere?`<h2>${esc(x.matiere)}</h2>`:''}${x.courses.map(c=>`<div class="course-block"><div class="course"><div><a class="main" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.course)} ↗</a><div class="slug">${esc(c.slug)}</div></div>${c.flag==='norun'?'<span class="badge norun">Non programmé</span>':'<span class="badge ok">Unlimited</span>'}</div></div>`).join('')}</article>`).join('');
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('theme').addEventListener('click',()=>{const r=document.documentElement;const d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark'});
render();
</script>
</body>
</html>
