<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MBA Administration Générale · Cours FutureLearn Unlimited</title>
<meta name="description" content="Vérification du statut Unlimited des cours FutureLearn associés au programme MBA Administration Générale (état au 15/10/2026).">
<style>
:root{--bg:#f6f8f6;--surface:#fff;--ink:#16241d;--muted:#586a60;--line:#e3e9e5;--accent:#0b4d2e;--accent-soft:#e9f2ed;--gold:#c9962a;
--ok:#16794c;--ok-bg:#e4f5ec;--warn:#9a6700;--warn-bg:#fff3d6;--bad:#b42318;--bad-bg:#fde8e6;--info:#475569;--info-bg:#eaeef4;--radius:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1420;--surface:#161e2e;--ink:#e8edf6;--muted:#9aa6bc;--line:#26324a;--accent:#7db3f0;--accent-soft:#1a2a44;
--ok:#59d39a;--ok-bg:#12301f;--warn:#f0c04f;--warn-bg:#3a2d0c;--bad:#ff8f84;--bad-bg:#3d1714;--info:#aab6cc;--info-bg:#1f2a40}}
:root[data-theme=dark]{--bg:#0e1420;--surface:#161e2e;--ink:#e8edf6;--muted:#9aa6bc;--line:#26324a;--accent:#7db3f0;--accent-soft:#1a2a44;--ok:#59d39a;--ok-bg:#12301f;--warn:#f0c04f;--warn-bg:#3a2d0c;--bad:#ff8f84;--bad-bg:#3d1714;--info:#aab6cc;--info-bg:#1f2a40}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;border-top:4px solid var(--gold)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px}
header.hero{padding:40px 0 20px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--accent);text-decoration:none}
h1{font-size:clamp(24px,4vw,34px);line-height:1.2;margin:0 0 8px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.todo b{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;margin-bottom:24px}
.bar i{display:block;height:100%}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5}
.tools input{flex:1 1 220px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.theme{margin-left:auto}
.list{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;border-left:5px solid var(--line)}
.card.ok{border-left-color:var(--ok)}.card.norun,.card.redir{border-left-color:var(--warn)}.card.no,.card.dead,.card.invite{border-left-color:var(--bad)}
.card h2{margin:0 0 2px;font-size:18px}
.course{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-top:8px}
.course a.main{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.course a.main:hover{text-decoration:underline}
.slug{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.norun,.badge.redir{background:var(--warn-bg);color:var(--warn)}
.badge.no,.badge.dead,.badge.invite{background:var(--bad-bg);color:var(--bad)}
.note{font-size:13.5px;color:var(--muted);margin-top:6px}
.rem{margin-top:12px;padding:12px 14px;background:var(--accent-soft);border-radius:10px}
.rem h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.rem ul{margin:0;padding-left:18px}
.rem li{margin:3px 0}
.rem a{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.rem a:hover{text-decoration:underline}
.course-block+.course-block{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:520px){.theme{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <div class="crumb"><a href="index.html">← Tous les programmes</a></div>
  <h1>MBA Administration Générale</h1>
  <p class="sub">Cours FutureLearn Unlimited à utiliser pour chaque matière du programme, vérifiés le 15/10/2026.</p>
</header>
<section class="stats" id="stats"></section>
<div class="bar" id="bar" aria-hidden="true"></div>
<div class="tools">
  <input id="q" type="search" placeholder="Rechercher une matière ou un cours…" aria-label="Rechercher">
  <button class="chip theme" id="theme" aria-label="Changer de thème">◐ Thème</button>
</div>
<main class="list" id="list"></main>
<footer>CESAG ONLINE · Vérification FutureLearn Unlimited · état au 15/10/2026</footer>
</div>
<script>
const ENGLISH=false;
const DATA=[{"matiere": "Finance", "courses": [{"course": "Corporate finance a beginners guide", "slug": "corporate-finance-a-beginners-guide", "url": "https://www.futurelearn.com/courses/corporate-finance-a-beginners-guide", "flag": null}, {"course": "Mastering sustainable finance", "slug": "mastering-sustainable-finance", "url": "https://www.futurelearn.com/courses/mastering-sustainable-finance", "flag": null}, {"course": "Fundamentals of corporate finance", "slug": "fundamentals-of-corporate-finance", "url": "https://www.futurelearn.com/courses/fundamentals-of-corporate-finance", "flag": null}, {"course": "Financial management", "slug": "financial-management", "url": "https://www.futurelearn.com/courses/financial-management", "flag": null}]}, {"matiere": "Management stratégique", "courses": [{"course": "Fundamentals of business strategy", "slug": "fundamentals-of-business-strategy", "url": "https://www.futurelearn.com/courses/fundamentals-of-business-strategy", "flag": null}]}, {"matiere": "Marchés financiers", "courses": [{"course": "Fundamentals of economics", "slug": "fundamentals-of-economics", "url": "https://www.futurelearn.com/courses/fundamentals-of-economics", "flag": null}]}, {"matiere": "Management interculturel", "courses": [{"course": "How to develop cultural awareness", "slug": "how-to-develop-cultural-awareness", "url": "https://www.futurelearn.com/courses/how-to-develop-cultural-awareness", "flag": "norun"}]}, {"matiere": "Droit des affaires", "courses": [{"course": "Introduction to business law", "slug": "introduction-to-business-law", "url": "https://www.futurelearn.com/courses/introduction-to-business-law", "flag": null}]}, {"matiere": "Marketing", "courses": [{"course": "Marketing essentials", "slug": "marketing-essentials", "url": "https://www.futurelearn.com/courses/marketing-essentials", "flag": "norun"}]}, {"matiere": "Développement personnel et professionnel", "courses": [{"course": "Professional resilience", "slug": "professional-resilience", "url": "https://www.futurelearn.com/courses/professional-resilience", "flag": null}]}, {"matiere": "Contrôle", "courses": [{"course": "Enterprise risk management", "slug": "enterprise-risk-management", "url": "https://www.futurelearn.com/courses/enterprise-risk-management", "flag": null}, {"course": "Project management insights", "slug": "project-management-insights", "url": "https://www.futurelearn.com/courses/project-management-insights", "flag": null}]}, {"matiere": "Création d'entreprise", "courses": [{"course": "Starting a business 1", "slug": "starting-a-business-1", "url": "https://www.futurelearn.com/courses/starting-a-business-1", "flag": null}, {"course": "Business planning growth and successful companies", "slug": "business-planning-growth-and-successful-companies-sc", "url": "https://www.futurelearn.com/courses/business-planning-growth-and-successful-companies-sc", "flag": null}]}, {"matiere": "Gestion financière", "courses": [{"course": "Understanding financial statements", "slug": "understanding-financial-statements-sc", "url": "https://www.futurelearn.com/courses/understanding-financial-statements-sc", "flag": null}]}, {"matiere": "Systèmes d'information", "courses": [{"course": "Systems thinking for sustainability drawing complexity on paper introduction to system mapping", "slug": "systems-thinking-for-sustainability-drawing-complexity-on-paper-introduction-to-system-mapping", "url": "https://www.futurelearn.com/courses/systems-thinking-for-sustainability-drawing-complexity-on-paper-introduction-to-system-mapping", "flag": null}]}];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total=DATA.reduce((a,g)=>a+g.courses.length,0);
document.getElementById('stats').innerHTML=(ENGLISH?'':`<div class="stat"><b>${DATA.length}</b><span>matières</span></div>`)+`<div class="stat ok"><b>${total}</b><span>cours Unlimited</span></div>`;
document.getElementById('bar').remove();
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const g=DATA.map(x=>({matiere:x.matiere,courses:x.courses.filter(c=>((x.matiere||'')+' '+c.course+' '+c.slug).toLowerCase().includes(q))})).filter(x=>x.courses.length);
  const l=document.getElementById('list');
  if(!g.length){l.innerHTML='<div class="empty">Aucun résultat.</div>';return}
  l.innerHTML=g.map(x=>`<article class="card ok">${x.matiere?`<h2>${esc(x.matiere)}</h2>`:''}${x.courses.map(c=>`<div class="course-block"><div class="course"><div><a class="main" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.course)} ↗</a><div class="slug">${esc(c.slug)}</div></div>${c.flag==='norun'?'<span class="badge norun">Non programmé</span>':'<span class="badge ok">Unlimited</span>'}</div></div>`).join('')}</article>`).join('');
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('theme').addEventListener('click',()=>{const r=document.documentElement;const d=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';r.dataset.theme=d?'light':'dark'});
render();
</script>
</body>
</html>
